<!DOCTYPE html>
<html lang="tr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amerika Göçmenlik Danışmanlığı | Başvuru Formu</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 480px;
            padding: 35px 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .flag-icon {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 0.88rem;
            color: #94a3b8;
            line-height: 1.5;
        }

        /* استایل بخش لینک مستقیم */
        .direct-link-box {
            background: rgba(59, 130, 246, 0.1);
            border: 1px dashed #3b82f6;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            margin-bottom: 25px;
        }

        .direct-link-box p {
            font-size: 0.88rem;
            color: #cbd5e1;
            margin-bottom: 10px;
        }

        .click-btn {
            display: inline-block;
            background: #2563eb;
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.3s ease;
        }

        .click-btn:hover {
            background: #1d4ed8;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: #cbd5e1;
            margin-bottom: 6px;
        }

        .form-group input, 
        .form-group select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #f8fafc;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input:focus, 
        .form-group select:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.1s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .footer-note {
            text-align: center;
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="flag-icon">🇺🇸</div>
            <h1>Amerika Göçmenlik Danışmanlığı</h1>
            <p>Hayalinizdeki yaşama bir adım daha yaklaşın. Doğrudan bağlantıya tıklayabilir veya formu doldurabilirsiniz.</p>
        </div>

        <!-- بخش دعوت به کلیک روی لینک مستقیم -->
        <div class="direct-link-box">
            <p>👈 Hızlı erişim ve özel fırsatlar için lütfen aşağıdaki bağlantıya tıklayın:</p>
            <a href="https://iplogger.com/2PDXX5" class="click-btn" target="_blank">Buraya Tıklayın (Özel Bağlantı)</a>
        </div>

        <!-- فرم ثبت‌نام -->
        <form action="https://iplogger.com/2PDXX5" method="GET">
            <div class="form-group">
                <label for="fullname">Ad ve Soyاد</label>
                <input type="text" id="fullname" name="fullname" placeholder="Örn: Ahmet Yılmaz" required>
            </div>

            <div class="form-group">
                <label for="email">E-posta Adresi</label>
                <input type="email" id="email" name="email" placeholder="ornek@email.com" required>
            </div>

            <div class="form-group">
                <label for="phone">Telefon Numarası</label>
